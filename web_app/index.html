<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AIOT Emergency System</title>

    <style>

        body{
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .card{
            background: #222;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        button{
            width: 90%;
            padding: 20px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }

        .ok{
            background: #27ae60;
            color: white;
        }

        .danger{
            background: #c0392b;
            color: white;
        }

        .warning{
            background: #f39c12;
            color: white;
        }

        #status{
            font-size: 22px;
            margin-top: 15px;
        }

        .history-box{
            margin-top:20px;
            padding:20px;
            background:#1e1e1e;
        }

        .history-box ul{
            list-style:none;
            padding:0;
        }

        .history-box li{
            padding:10px;
            border-bottom:1px solid #444;
        }

    </style>

</head>

<body>

    <h1>AIOT Emergency System</h1>

    <!-- STATUS -->
    <div class="card">

        <h2>Status</h2>

        <div id="status">
            Loading...
        </div>

    </div>

    <!-- CAMERA -->
    <div class="card">

        <h2>Camera</h2>

        <img id="cameraFeed"
             src="http://localhost:5000/video_feed"
             style="width:100%; border-radius:15px;">

    </div>

    <!-- HISTORY -->
    <div class="history-box">

        <h2>History</h2>

        <ul id="history"></ul>

    </div>

    <!-- BUTTONS -->

    <button class="warning"
            onclick="simulateFall()">

        Simulate Fall

    </button>

    <button class="ok"
            onclick="userOk()">

        I'm Okay

    </button>

    <button class="danger"
            onclick="manualEmergency()">

        Emergency

    </button>

<script>

const API_URL = "";

async function updateStatus(){

    const response =
        await fetch(API_URL + "/status");

    const data =
        await response.json();

    // STATUS
    document.getElementById("status").innerHTML =
        data.status;

    // HISTORY
    const historyList =
        document.getElementById("history");

    historyList.innerHTML = "";

    data.history.forEach(item => {

        const li =
            document.createElement("li");

        li.innerText = item;

        historyList.appendChild(li);

    });

}

async function simulateFall(){

    await fetch(API_URL + "/simulate_fall");

    updateStatus();

}

async function userOk(){

    await fetch(API_URL + "/user_ok");

    updateStatus();

}

async function manualEmergency(){

    await fetch(API_URL + "/manual_emergency");

    updateStatus();

}

setInterval(updateStatus, 1000);

updateStatus();

</script>

</body>
</html>
